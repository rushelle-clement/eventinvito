<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Sample logo for the gallery demos: a made-up company ("Lumora Group"). One colour with a cut-out,
       so the designs can show it in their own colours. -->
  <defs>
    <mask id="hole">
      <rect width="420" height="110" fill="#fff"/>
      <circle cx="55" cy="55" r="12" fill="#000"/>
    </mask>
  </defs>
  <g fill="#1d2b4f" mask="url(#hole)">
    <rect x="14" y="25" width="60" height="60" rx="14" transform="rotate(-12 44 55)"/>
    <rect x="36" y="13" width="60" height="60" rx="14" opacity="0.75" transform="rotate(12 66 43)"/>
  </g>
  <text x="120" y="66" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="2" fill="#1d2b4f">LUMORA</text>
  <text x="122" y="94" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="9" fill="#1d2b4f">GROUP</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
